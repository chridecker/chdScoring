name: Build MAUI Android APP
on:
  workflow_dispatch:
    inputs: 
      build_config:
        description: 'How to build'
        required: true
        type: choice
        options: [Release, Debug]
        default: 'Release'
      play_track:
        description: 'Google Play Track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: 'Google Play Status'
        type: choice
        options: [complete, draft]
        default: draft
      
permissions:
  contents: write
  
jobs:
  build:
    env:
      BUILD_CONFIG: ${{ github.event.inputs.build_config }}
      SOLUTION: 'chdscoring.sln'
      
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
   
    - name: Install Maui
      run: dotnet workload install maui 
           
    - name: Set Version
      shell: pwsh
      run: |
        $now = (Get-Date).ToUniversalTime()
        $version = "2.2.$($now.ToString('yy'))$($now.DayOfYear.ToString('000')).$($now.ToString('HHmm'))"
        echo $version
        "VERSION=$version" >> $env:GITHUB_ENV

    - name: Publish
      run: >
        dotnet publish ${{ env.APP_PROJECT }}
        --no-restore
        --configuration ${{ env.BUILD_CONFIG }}
        --framework net10.0-android
        /p:ApplicationDisplayVersion=${{ env.VERSION }}
        /p:ApplicationVersion=${{ github.run_number }}
        /p:AndroidVersionCode=${{ github.run_number }}
        /p:AndroidKeyStore=true
        /p:AndroidSigningKeyStore=chdscoring.keystore
        /p:AndroidSigningKeyAlias=chdScoring
        /p:AndroidSigningKeyPass=${{ secrets.CHDSCORING_KEYPASS }}
        /p:AndroidSigningStorePass=${{ secrets.CHDSCORING_KEYPASS }}

    - name: Collect files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force release | Out-Null
        if ("${{ inputs.use_aab }}" -eq "true") {
          $aab = Get-ChildItem -Recurse src -Filter *-Signed.aab | Where-Object { $_.FullName -match 'publish' } | Select-Object -First 1
          Copy-Item $aab.FullName "release/chdScoring-${{ env.VERSION }}.aab"
        }
        if ("${{ inputs.use_apk }}" -eq "true") {
          $apk = Get-ChildItem -Recurse src -Filter *.apk | Where-Object { $_.FullName -match 'publish' } | Select-Object -First 1
          Copy-Item $apk.FullName "release/chdScoring-${{ env.VERSION }}.apk"
        }
  
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chdScoring-${{ env.VERSION }}
        path: release/*
        
    - name: Create Tag and Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        name: chd Scoring Mobilde ${{ env.VERSION }}
        files: release/*.exe
        generate_release_notes: true
        prerelease: ${{ env.BUILD_CONFIG == 'Debug' }}
        make_latest: ${{ env.BUILD_CONFIG == 'Release' }}

    - name: Upload to Google Play
      if: ${{ inputs.build_config == 'Release' }}
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: ${{ env.PACKAGE_NAME }}
        releaseFiles: release/*.aab
        track: ${{ inputs.play_track }}
        status:  ${{ inputs.play_status }} # "completed"   "draft", falls die App in Play noch im Entwurfsstatus ist

     
        
