<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chdScoring - Timer</title>
    <link rel="stylesheet" href="css/fa.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div id="timer-container">
        <div class="pause-container">
            <i class="fa fa-circle-pause fa-regular"></i>
        </div>
        <div class="timer-container hide">
            <div class="pilot">
                <div class="country">
                    <div class="custom-image">
                        <img src="" alt="" />
                    </div>
                </div>
                <div class="number"></div>
                <div class="name"></div>
            </div>
            <div class="time">
                <div class="icon">
                    <i class="fa fa-hand fa-thin"></i>
                    <i class="fa fa-plane-departure fa-thin hide"></i>
                    <i class="fa fa-plane-slash fa-thin hide"></i>
                    <i class="fa fa-play-pause fa-thin hide"></i>
                </div>
                <div class="left-time"></div>
            </div>
        </div>
    </div>
    <script src="js/fa.js"></script>
    <script src="js/signalr.js"></script>
    <script src="js/timer.js"></script>
    <script>
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:8081/chdscoring/flight-hub", {
                transport: signalR.HttpTransportType.LongPolling,
                headers: {
                    "X-Api-Key": "ch3510ri"
                }
            })
            .withAutomaticReconnect()
            .configureLogging(signalR.LogLevel.Information)
            .build();

        connection.onclose(async () => {
            await startHubConnection(connection);
        });

        // Start the connection.
        startHubConnection(connection);
    </script>
</body>
</html>
