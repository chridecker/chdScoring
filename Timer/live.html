<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chdScoring - Timer</title>
     <link rel="stylesheet" href="css/fa.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div id="timer-container">
        <div class="pause-container">
             <i class="fa fa-circle-pause fa-regular"></i>
        </div>
       <div class="control-center hide">
            <div class="pilot-data">
                <div class="country">
                    <div class="custom-image">
                          <img src="" alt="" />
                    </div>
                </div>
            <div class="name"></div>
            <div class="left-time"></div>
            </div>
            <div class="maneouvres"></div>
    </div>
</div>
    <script src="js/fa.js"></script>
    <script src="js/signalr.js"></script>
    <script src="js/live.js" ></script>
    <script>
        const connection = new signalR.HubConnectionBuilder()
        .withUrl("http://localhost:5205/chdscoring/timer-hub")
        .build();

        connection.onclose(async () => {
            await startHubConnection(connection);
        });

        // Start the connection.
        startHubConnection(connection);
    </script>
</body>
</html>
